# Cloudflare Pages 배포 설정 (https://ipeun.pages.dev)
# 빌드: 저장소 루트에서 `npm run build:pages` → deploy/pages/dist (공개 파일 + _worker.js)
# 배포: 저장소 루트에서 `npm run deploy`
name = "ipeun"
pages_build_output_dir = "./dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# "true": i-peun.com 에서만 검색 노출. *.pages.dev 임시 주소는 항상 숨긴다 (worker/index.js indexable)
SITE_INDEXABLE = "true"
# Pages 정적 파일 서빙 방식에 맞춰 Worker가 주소를 맞춘다 (worker/index.js)
PAGES_MODE = "1"

[[d1_databases]]
binding = "DB"
database_name = "ipeun"
database_id = "5d6ea2a8-2d19-43a1-b460-516c3e7cbf57"

[ai]
binding = "AI"
