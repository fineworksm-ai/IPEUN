# IPEUN 웹사이트 — 로컬 개발용 Worker 설정 (npm run dev)
# 실제 사이트는 Cloudflare Pages(https://ipeun.pages.dev)로 배포한다: npm run deploy  (설정: deploy/pages/wrangler.toml)
# 이 파일로 `wrangler deploy` 를 하면 *.workers.dev 주소가 생기지 않도록 막아 둔다.
name = "ipeun"
main = "worker/index.js"
workers_dev = false
preview_urls = false
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# 저장소 루트를 정적 파일로 서빙한다. 공개하면 안 되는 파일은 .assetsignore 에서 제외한다.
[assets]
directory = "."
binding = "ASSETS"
# 모든 요청을 Worker가 먼저 받는다: 관리자 데이터 반영(HTMLRewriter), 방문 집계, /api, /admin
run_worker_first = true
# 지금 정적 호스팅과 같게 company.html 주소를 그대로 쓴다 (자동 .html 제거를 끄면 _redirects 와 충돌하지 않는다)
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "ipeun"
# 2026-10-06 생성 (Fineworks 계정, APAC). 로컬 개발(wrangler dev)은 이 값과 상관없이 동작한다.
database_id = "5d6ea2a8-2d19-43a1-b460-516c3e7cbf57"

# 검색엔진 노출: 임시 주소(workers.dev)에서는 "false" 로 둔다.
# 정식 도메인을 연결하는 날 "true" 로 바꾸고 배포하면 검색 노출이 시작된다.
[vars]
SITE_INDEXABLE = "false"

# 한글 → 영문 자동 번역 (ANTHROPIC_API_KEY 시크릿이 없을 때 사용)
[ai]
binding = "AI"

# 시크릿(값은 저장소에 넣지 않는다):
#   npx wrangler secret put ADMIN_PASSWORD     관리자 비밀번호
#   npx wrangler secret put SESSION_SECRET     로그인 쿠키 서명 키 (긴 임의 문자열)
#   npx wrangler secret put ANTHROPIC_API_KEY  (선택) 있으면 Claude로 번역
# 로컬 개발용 값은 .dev.vars 에 둔다 (gitignore 됨).
